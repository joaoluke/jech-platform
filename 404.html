<!doctype html>
<html lang="pt-BR">

<head>
	<meta charset="UTF-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1.0" />
	<title>Página não encontrada - Jech</title>
	<link rel="icon" type="image/svg+xml" href="icons/favicon.svg" />
	<link rel="stylesheet" href="src/input.css" />
	<script>
		// Tenta redirecionar URLs limpas para as páginas corretas
		(function () {
			const path = window.location.pathname;
			const redirects = {
				'/playground': '/playground.html',
				'/docs': '/docs.html',
				'/internals': '/internals.html'
			};

			if (redirects[path]) {
				window.location.replace(redirects[path]);
			}
		})();
	</script>
</head>

<body>
	<nav
		class="navbar sticky top-0 z-sticky bg-bg-dark/80 backdrop-blur border-b border-bg-dark-3/20 py-4 transition-all duration-300">
		<div class="container flex justify-between items-center">
			<a href="/"
				class="logo flex items-center gap-2 text-2xl font-extrabold transition-transform hover:scale-105">
				<img src="images/JECH.png" alt="JECH Logo"
					class="logo-img w-10 h-10 object-contain transition-all hover:rotate-[-5deg]"
					style="filter: drop-shadow(0 0 8px rgba(16, 185, 129, 0.3));" />
				<span class="bg-gradient-to-r from-primary to-accent bg-clip-text text-transparent">JECH</span>
			</a>
			<div class="nav-links flex items-center gap-8">
				<a href="/" class="font-medium text-text-secondary hover:text-primary transition-colors"
					data-i18n="nav.home">Início</a>
				<a href="/playground" class="font-medium text-text-secondary hover:text-primary transition-colors"
					data-i18n="nav.playground">Playground</a>
				<a href="/docs" class="font-medium text-text-secondary hover:text-primary transition-colors"
					data-i18n="nav.docs">Documentação</a>
				<a href="/internals" class="font-medium text-text-secondary hover:text-primary transition-colors"
					data-i18n="nav.internals">Como Funciona</a>
				<a href="https://github.com/joaoluke/jech" target="_blank"
					class="font-medium text-text-secondary hover:text-primary transition-colors"
					data-i18n="nav.github">GitHub</a>
			</div>
		</div>
	</nav>

	<div class="min-h-[80vh] flex flex-col items-center justify-center text-center px-8 py-16">
		<h1
			class="text-[8rem] font-bold leading-none bg-gradient-to-br from-primary to-accent bg-clip-text text-transparent mb-0">
			404
		</h1>
		<p class="text-2xl text-text-secondary my-4">Página não encontrada</p>
		<p class="text-text-muted mb-8 max-w-md">
			A página que você está procurando não existe ou foi movida.
		</p>
		<div class="flex flex-wrap gap-4 justify-center">
			<a href="/" class="btn btn-primary">Voltar ao Início</a>
			<a href="/playground" class="btn btn-secondary">Ir para o Playground</a>
		</div>
	</div>

	<footer class="footer bg-bg-dark-2 border-t border-bg-dark-3 py-6">
		<div class="container">
			<div class="text-center text-text-muted text-sm">
				<p>&copy; 2026 Jech Programming Language. Open Source sob MIT License.</p>
			</div>
		</div>
	</footer>

	<script src="js/i18n/translations.js"></script>
	<script src="js/i18n/i18n.js"></script>
</body>

</html>
